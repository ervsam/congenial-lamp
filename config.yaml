warehouse_2:
  root: "results/"

  environment:
    NUM_AGENTS: 70
    WINDOW_SIZE: 20
    FOV: 81 # WINDOW_SIZE * 4 + 1
  
  training:
    N_ACTIONS: 3
    DEVICE: "cuda:2"
    BATCH_SIZE: 128
    LR: 1e-4
    EPOCHS: 100

  paths:
    results: "warehouse_2_supervise/"
    map_file: "maps/warehouse_2/grid_map.npy"
    heur_file: "maps/warehouse_2/heuristic.npy"
    goals_locs: "maps/warehouse_2/goal_options.npy"
    start_locs: "maps/warehouse_2/start_options.npy"
